name: Step 10 full activation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/step10-full-activation.yml"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test

  scan:
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider: ["Habitaclia", "Pisos.com", "Fotocasa", "Servihabitat"]
        province: ["Barcelona", "Tarragona", "Girona", "Lleida"]

    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SCAN_PROVIDER: ${{ matrix.provider }}
      SCAN_PROVINCE: ${{ matrix.province }}
      SCAN_MODE: "recent"
      INCREMENTAL_ONLY: "true"
      OUTPUT_PATH: "data/shard.json"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      - name: Discover
        env:
          PIPELINE_PHASE: "discover"
          OUTPUT_PATH: "data/discovery.json"
        run: npm run update:listings

      - name: Plan new or security-backfill listings
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/discovery-plan"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/discovery.json > data/plan.json
          jq -e '.ok == true' data/plan.json
          jq '{discovered,planned,scanMode}' data/plan.json

      - name: Classify
        env:
          PIPELINE_PHASE: "classify"
          PLAN_PATH: "data/plan.json"
          OUTPUT_PATH: "data/shard.json"
        run: npm run update:listings

      - name: Ingest and complete ledger
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"

          INGEST="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/ingest-listings"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/shard.json)"
          printf '%s' "$INGEST" | jq -e '.ok == true'
          printf '%s' "$INGEST" | jq '{accepted,rejected,securityTextStored,withdrawn}'

          OFFICIAL="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/official-checks"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/shard.json)"
          printf '%s' "$OFFICIAL" | jq -e '.ok == true'

          jq '{action:"complete",generatedAt,pipelineResults}' data/shard.json > data/discovery-complete.json
          COMPLETE="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/discovery-plan"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/discovery-complete.json)"
          printf '%s' "$COMPLETE" | jq -e '.ok == true'

  revalidate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SCAN_MODE: "deep"
      PIPELINE_PHASE: "classify"
      PLAN_PATH: "data/revalidation-plan.json"
      OUTPUT_PATH: "data/revalidation-shard.json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      - name: Plan missing security text and due listings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          OIDC_JSON="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/revalidation-plan"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data '{"action":"plan","limit":100}' > data/revalidation-plan.json
          jq -e '.ok == true' data/revalidation-plan.json
          jq '{planned}' data/revalidation-plan.json

      - name: Revalidate
        run: npm run update:listings

      - name: Ingest revalidation and complete
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"

          INGEST="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/ingest-listings"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/revalidation-shard.json)"
          printf '%s' "$INGEST" | jq -e '.ok == true'
          printf '%s' "$INGEST" | jq '{accepted,rejected,securityTextStored,withdrawn}'

          jq '{action:"complete",generatedAt,pipelineResults}' data/revalidation-shard.json > data/revalidation-complete.json
          COMPLETE="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/revalidation-plan"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/revalidation-complete.json)"
          printf '%s' "$COMPLETE" | jq -e '.ok == true'
          printf '%s' "$COMPLETE" | jq '{processed,valid,withdrawn,quarantined,errors}'

  reclassify:
    needs: revalidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reclassify after private-text backfill
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          RESPONSE="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/reclassify-safety"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data '{}')"
          printf '%s' "$RESPONSE" | jq -e '.ok == true'
          printf '%s' "$RESPONSE" | jq '{processed,accepted,review,rejected,fullTextUsed}'

  services:
    needs: reclassify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh nearby services
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          RESPONSE="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/nearby-services"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data '{"limit":8}')"
          printf '%s' "$RESPONSE" | jq -e '.ok == true'
