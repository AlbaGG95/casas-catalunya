name: Actualizar viviendas

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo de escaneo"
        required: false
        default: "deep"
        type: choice
        options: [recent, deep]
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "supabase/**"
      - "app.js"
      - "index.html"
      - "sw.js"
      - "property.js"
      - "property.html"
      - "styles.css"
      - "ui-v2.css"
      - "accessibility.css"
      - "system.html"
      - "system.js"
      - "package.json"
      - ".github/workflows/refresh-listings.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "supabase/**"
      - "app.js"
      - "index.html"
      - "sw.js"
      - "property.js"
      - "property.html"
      - "styles.css"
      - "ui-v2.css"
      - "accessibility.css"
      - "system.html"
      - "system.js"
      - "package.json"
      - ".github/workflows/refresh-listings.yml"
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2 * * * *"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Ejecutar regresiones de seguridad
        run: npm test

  reclassify:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reprocesar catálogo activo con SafetyEngine v2
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          RESPONSE="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/reclassify-safety"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data '{}')"
          echo "$RESPONSE"
          echo "$RESPONSE" | jq -e '.ok == true'
          echo "$RESPONSE" | jq -e '.processed >= 1'

  scan:
    if: github.event_name != 'pull_request'
    needs: [test, reclassify]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        provider: ["Habitaclia", "Pisos.com", "Fotocasa", "Yaencontre", "Servihabitat", "Idealista", "Indomio"]
        province: ["Barcelona", "Tarragona", "Girona", "Lleida"]

    runs-on: ubuntu-latest
    timeout-minutes: 18

    concurrency:
      group: casas-${{ matrix.provider }}-${{ matrix.province }}-${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '2 * * * *' && 'deep' || github.event_name == 'push' && 'deep' || 'recent' }}
      cancel-in-progress: true

    env:
      SCAN_PROVIDER: ${{ matrix.provider }}
      SCAN_PROVINCE: ${{ matrix.province }}
      SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '2 * * * *' && 'deep' || github.event_name == 'push' && 'deep' || 'recent' }}
      INCREMENTAL_ONLY: "true"
      OUTPUT_PATH: "data/shard.json"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      - name: Descubrir anuncios ${{ matrix.provider }} · ${{ matrix.province }}
        env:
          PIPELINE_PHASE: "discover"
          OUTPUT_PATH: "data/discovery.json"
        run: npm run update:listings

      - name: Planificar fichas nuevas o pendientes
        shell: bash
        run: |
          set -euo pipefail
          test -f data/discovery.json
          OIDC_JSON="$(curl -sSf             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/discovery-plan"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/discovery.json             > data/plan.json
          jq -e '.ok == true' data/plan.json
          jq '{discovered,planned,scanMode}' data/plan.json

      - name: Validar únicamente fichas planificadas
        env:
          PIPELINE_PHASE: "classify"
          PLAN_PATH: "data/plan.json"
          OUTPUT_PATH: "data/shard.json"
        run: npm run update:listings

      - name: Sincronizar resultados validados con Supabase
        shell: bash
        run: |
          set -euo pipefail
          test -f data/shard.json
          OIDC_JSON="$(curl -sSf             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          test -n "$OIDC_TOKEN"

          RESPONSE="$(curl -sSf             -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/ingest-listings"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/shard.json)"
          echo "$RESPONSE"
          printf '%s' "$RESPONSE" | jq -e '.ok == true'

          OFFICIAL="$(curl -sSf             -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/official-checks"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/shard.json)"
          echo "$OFFICIAL"
          printf '%s' "$OFFICIAL" | jq -e '.ok == true'

          jq '{action:"complete",generatedAt,pipelineResults}' data/shard.json > data/discovery-complete.json
          COMPLETE="$(curl -sSf             -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/discovery-plan"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/discovery-complete.json)"
          echo "$COMPLETE"
          printf '%s' "$COMPLETE" | jq -e '.ok == true'


  revalidate:
    if: github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '2 * * * *')
    needs: [test, reclassify]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SCAN_MODE: "deep"
      PIPELINE_PHASE: "classify"
      PLAN_PATH: "data/revalidation-plan.json"
      OUTPUT_PATH: "data/revalidation-shard.json"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      - name: Planificar revalidaciones vencidas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          OIDC_JSON="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/revalidation-plan"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data '{"action":"plan","limit":60}' > data/revalidation-plan.json
          jq -e '.ok == true' data/revalidation-plan.json
          jq '{planned}' data/revalidation-plan.json

      - name: Revalidar fichas vencidas
        run: npm run update:listings

      - name: Aplicar resultados de revalidación
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"

          INGEST="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/ingest-listings"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/revalidation-shard.json)"
          echo "$INGEST"
          printf '%s' "$INGEST" | jq -e '.ok == true'

          jq '{action:"complete",generatedAt,pipelineResults}' data/revalidation-shard.json > data/revalidation-complete.json
          RESULT="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/revalidation-plan"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/revalidation-complete.json)"
          echo "$RESULT"
          printf '%s' "$RESULT" | jq -e '.ok == true'

  services:
    if: always() && github.event_name != 'pull_request'
    needs: [test, reclassify, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enriquecer servicios cercanos con caché semanal
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          RESPONSE="$(curl -sSf -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/nearby-services"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data '{"limit":8}')"
          echo "$RESPONSE"
