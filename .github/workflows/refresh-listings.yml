name: Actualizar viviendas

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo de escaneo"
        required: false
        default: "deep"
        type: choice
        options: [recent, deep]
  push:
    branches: ["main"]
    paths-ignore:
      - "data/listings.json"
      - "data/geocache.json"
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2 * * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: refresh-${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '2 * * * *' && 'deep' || github.event_name == 'push' && 'deep' || 'recent' }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '2 * * * *' && 'deep' || github.event_name == 'push' && 'deep' || 'recent' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      - name: Buscar y filtrar viviendas
        run: npm run update:listings

      - name: Sincronizar catálogo validado con Supabase
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -sSf             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=casas-catalunya-supabase")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          curl -sSf             -X POST             "https://ethtlpnvqyxkoeudtcsj.supabase.co/functions/v1/ingest-listings"             -H "Authorization: Bearer ${OIDC_TOKEN}"             -H "Content-Type: application/json"             --data-binary @data/listings.json

      - name: Guardar copia de respaldo en GitHub
        shell: bash
        run: |
          if git diff --quiet -- data/listings.json data/geocache.json; then exit 0; fi
          git config user.name "casas-catalunya-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json data/geocache.json
          git commit -m "data: actualizar viviendas [${SCAN_MODE}]"
          git push
