name: Actualizar viviendas

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Tipo de escaneo"
        required: false
        default: "deep"
        type: choice
        options:
          - recent
          - deep
  push:
    branches: ["main"]
    paths-ignore:
      - "data/listings.json"
      - "data/geocache.json"
  schedule:
    - cron: "*/15 * * * *"
    - cron: "7 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-listings
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '7 0,6,12,18 * * *' && 'deep' || github.event_name == 'push' && 'deep' || 'recent' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Buscar, filtrar y revalidar viviendas
        run: npm run update:listings

      - name: Guardar datos
        shell: bash
        run: |
          if git diff --quiet -- data/listings.json data/geocache.json; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "casas-catalunya-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.json data/geocache.json
          git commit -m "data: actualizar viviendas [${SCAN_MODE}]"
          git push
